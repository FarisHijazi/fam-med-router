<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Referral Router - Adult Obesity Pathway</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
        }
        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .panel h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        .bmi-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin: 15px 0;
        }
        .bmi-value {
            font-size: 2em;
            font-weight: bold;
        }
        .bmi-category {
            font-size: 0.9em;
            opacity: 0.9;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .pathway-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pathway-node {
            padding: 15px 20px;
            border-radius: 10px;
            position: relative;
            transition: all 0.3s;
        }
        .pathway-node.active {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        .pathway-node.inactive {
            opacity: 0.4;
        }
        .node-assessment { background: #e3f2fd; border-left: 4px solid #1976d2; }
        .node-decision { background: #fff3e0; border-left: 4px solid #f57c00; }
        .node-treatment { background: #e8f5e9; border-left: 4px solid #388e3c; }
        .node-referral { background: #fce4ec; border-left: 4px solid #c2185b; }
        .node-evaluation { background: #f3e5f5; border-left: 4px solid #7b1fa2; }
        .node-endpoint { background: #e0f2f1; border-left: 4px solid #00796b; }
        .node-title {
            font-weight: 600;
            font-size: 1.1em;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .node-layer {
            font-size: 0.75em;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.1);
        }
        .node-description {
            color: #666;
            font-size: 0.9em;
        }
        .node-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(0,0,0,0.1);
            font-size: 0.85em;
        }
        .arrow {
            text-align: center;
            color: #999;
            font-size: 1.5em;
        }
        .clinic-list {
            margin-top: 10px;
        }
        .clinic-item {
            background: rgba(255,255,255,0.7);
            padding: 8px 12px;
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .status-open { background: #4caf50; }
        .status-limited { background: #ff9800; }
        .status-closed { background: #f44336; }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 10px 20px;
            background: #f0f0f0;
            border: none;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: 600;
        }
        .tab.active {
            background: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .hierarchy-view {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        .layer-column h3 {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            color: white;
            margin-bottom: 15px;
        }
        .layer-1 h3 { background: #1976d2; }
        .layer-2 h3 { background: #f57c00; }
        .layer-3 h3 { background: #c62828; }
        .center-card {
            background: #f9f9f9;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .center-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .center-name-ar {
            font-size: 0.85em;
            color: #666;
            direction: rtl;
        }
        .clinic-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin: 2px;
            background: #e8f5e9;
            color: #2e7d32;
        }
        .test-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        .test-badge {
            background: #e3f2fd;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .hierarchy-view {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Medical Referral Router - Adult Obesity Pathway</h1>

        <div class="tabs">
            <button class="tab active" onclick="showTab('pathway')">Pathway Navigator</button>
            <button class="tab" onclick="showTab('structure')">Data Structure</button>
        </div>

        <div id="pathway-tab" class="tab-content active">
            <div class="main-grid">
                <div class="panel">
                    <h2>Patient Information</h2>

                    <div class="form-group">
                        <label>Age (years)</label>
                        <input type="number" id="age" value="35" min="0" max="120" onchange="updatePathway()">
                    </div>

                    <div class="form-group">
                        <label>Gender</label>
                        <select id="gender" onchange="updatePathway()">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <hr>
                    <h3>Measurements</h3>

                    <div class="form-group">
                        <label>Weight (kg)</label>
                        <input type="number" id="weight" value="95" min="1" max="500" step="0.1" onchange="calculateBMI()">
                    </div>

                    <div class="form-group">
                        <label>Height (cm)</label>
                        <input type="number" id="height" value="170" min="50" max="250" step="0.1" onchange="calculateBMI()">
                    </div>

                    <div class="form-group">
                        <label>Waist Circumference (cm)</label>
                        <input type="number" id="waist" value="102" min="30" max="250" step="0.1">
                    </div>

                    <div class="bmi-display">
                        <div class="bmi-value" id="bmi-value">32.9</div>
                        <div class="bmi-category" id="bmi-category">Class I Obesity</div>
                    </div>

                    <hr>
                    <h3>Clinical Assessment</h3>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="secondary-cause" onchange="updatePathway()">
                        <label for="secondary-cause">Has Secondary Cause of Obesity</label>
                    </div>

                    <div class="form-group" id="secondary-cause-select" style="display:none;">
                        <label>Secondary Cause</label>
                        <select id="secondary-type">
                            <option value="hypothyroidism">Hypothyroidism</option>
                            <option value="cushing">Cushing's Syndrome</option>
                            <option value="pcos">PCOS</option>
                            <option value="medication">Medication-Induced</option>
                            <option value="eating-disorder">Eating Disorder</option>
                            <option value="depression">Depression</option>
                        </select>
                    </div>

                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="comorbidities" onchange="updatePathway()">
                        <label for="comorbidities">Has Comorbidities</label>
                    </div>

                    <div class="form-group" id="comorbidities-select" style="display:none;">
                        <label>Comorbidities (hold Ctrl to select multiple)</label>
                        <select id="comorbidity-list" multiple size="5">
                            <option value="diabetes">Diabetes Mellitus</option>
                            <option value="hypertension">Hypertension</option>
                            <option value="dyslipidemia">Dyslipidemia</option>
                            <option value="sleep-apnea">Sleep Apnea</option>
                            <option value="osteoarthritis">Osteoarthritis</option>
                            <option value="gerd">GERD</option>
                            <option value="fatty-liver">Fatty Liver Disease</option>
                        </select>
                    </div>

                    <hr>
                    <h3>Follow-up Data</h3>

                    <div class="form-group">
                        <label>Weight Loss Achieved (%): <span id="weight-loss-value">0</span>%</label>
                        <input type="range" id="weight-loss" value="0" min="0" max="20" oninput="updateWeightLoss()">
                    </div>

                    <button onclick="updatePathway()">Update Pathway</button>
                </div>

                <div class="panel">
                    <h2>Pathway Visualization</h2>
                    <div id="pathway-container" class="pathway-container">
                        <!-- Pathway nodes will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <div id="structure-tab" class="tab-content">
            <div class="panel">
                <h2>Health System Hierarchy - Dammam Network</h2>
                <div class="hierarchy-view">
                    <div class="layer-column layer-1">
                        <h3>Layer 1: PHCs</h3>
                        <div id="phc-centers"></div>
                    </div>
                    <div class="layer-column layer-2">
                        <h3>Layer 2: Mega Centers</h3>
                        <div id="mega-centers"></div>
                    </div>
                    <div class="layer-column layer-3">
                        <h3>Layer 3: Hospitals</h3>
                        <div id="hospital-centers"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data structures
        const clusters = {
            eastern: {
                name: "Eastern Health Cluster",
                networks: {
                    dammam: {
                        name: "Dammam Network",
                        centers: [
                            {
                                id: "phc_anak",
                                name: "Al-Anak Primary Health Center",
                                name_ar: "مركز العناك الصحي",
                                type: "phc",
                                clinics: [{ name: "Family Medicine Clinic", specialty: "family_medicine", status: "open" }]
                            },
                            {
                                id: "phc_badiah",
                                name: "Al-Badiah Primary Health Center",
                                name_ar: "مركز البادية الصحي",
                                type: "phc",
                                clinics: [{ name: "Family Medicine Clinic", specialty: "family_medicine", status: "open" }]
                            },
                            {
                                id: "phc_nakheel",
                                name: "Al-Nakheel Primary Health Center",
                                name_ar: "مركز النخيل الصحي",
                                type: "phc",
                                clinics: [{ name: "Family Medicine Clinic", specialty: "family_medicine", status: "open" }]
                            },
                            {
                                id: "mega_south",
                                name: "Dammam South Mega Center",
                                name_ar: "مركز جنوب الدمام التخصصي",
                                type: "mega",
                                clinics: [
                                    { name: "Obesity Clinic", specialty: "obesity", status: "open" },
                                    { name: "Internal Medicine", specialty: "internal_medicine", status: "open" },
                                    { name: "Endocrinology", specialty: "endocrinology", status: "open" },
                                    { name: "Psychiatry", specialty: "psychiatry", status: "open" }
                                ]
                            },
                            {
                                id: "mega_north",
                                name: "Dammam North Mega Center",
                                name_ar: "مركز شمال الدمام التخصصي",
                                type: "mega",
                                clinics: [
                                    { name: "Obesity Clinic", specialty: "obesity", status: "open" },
                                    { name: "Pediatrics", specialty: "pediatrics", status: "open" },
                                    { name: "Dermatology", specialty: "dermatology", status: "open" }
                                ]
                            },
                            {
                                id: "mega_central",
                                name: "Dammam Central Mega Center",
                                name_ar: "مركز وسط الدمام التخصصي",
                                type: "mega",
                                clinics: [
                                    { name: "Obesity Clinic", specialty: "obesity", status: "open" },
                                    { name: "Neurology", specialty: "neurology", status: "open" },
                                    { name: "Gastroenterology", specialty: "gastroenterology", status: "open" }
                                ]
                            },
                            {
                                id: "mega_west",
                                name: "Dammam West Mega Center",
                                name_ar: "مركز غرب الدمام التخصصي",
                                type: "mega",
                                clinics: [
                                    { name: "Obesity Clinic", specialty: "obesity", status: "limited" },
                                    { name: "Urology", specialty: "urology", status: "open" },
                                    { name: "Oncology", specialty: "oncology", status: "open" }
                                ]
                            },
                            {
                                id: "dmc",
                                name: "Dammam Medical Complex",
                                name_ar: "مجمع الدمام الطبي",
                                type: "hospital",
                                clinics: [
                                    { name: "Bariatric Surgery", specialty: "bariatric_surgery", status: "open" },
                                    { name: "General Surgery", specialty: "general_surgery", status: "open" },
                                    { name: "Plastic Surgery", specialty: "plastic_surgery", status: "open" }
                                ]
                            },
                            {
                                id: "mch",
                                name: "Maternity and Children Hospital",
                                name_ar: "مستشفى الولادة والأطفال",
                                type: "hospital",
                                clinics: [
                                    { name: "Pediatric Obesity", specialty: "pediatric_obesity", status: "open" },
                                    { name: "Pediatric Endocrinology", specialty: "pediatric_endocrinology", status: "open" }
                                ]
                            }
                        ]
                    }
                }
            }
        };

        const pathwayNodes = {
            screening: {
                id: "screening",
                type: "assessment",
                name: "Screening Protocol in PHCs",
                description: "Initial screening: BMI & Waist Circumference measurement",
                layer: "PHC",
                icon: "🏥"
            },
            bmi_check: {
                id: "bmi_check",
                type: "decision",
                name: "BMI Assessment",
                description: "Evaluate BMI value and determine pathway",
                layer: "PHC",
                icon: "🏥"
            },
            exit_healthy: {
                id: "exit_healthy",
                type: "endpoint",
                name: "Normal Weight - No Intervention",
                description: "BMI < 25: No obesity intervention needed",
                layer: "PHC",
                icon: "🏥",
                outcome: "success"
            },
            refer_specialty: {
                id: "refer_specialty",
                type: "referral",
                name: "Refer to Appropriate Specialty",
                description: "Secondary cause identified - refer to endocrine, psychiatry, etc.",
                layer: "Mega Center",
                icon: "🏢"
            },
            diagnostic_tests: {
                id: "diagnostic_tests",
                type: "assessment",
                name: "Diagnostic Tests",
                description: "Order workup: CBC, RFT, LFT, Lipid, Uric acid, UA, FBS, HbA1c, TFT",
                layer: "PHC",
                icon: "🏥",
                tests: ["CBC", "RFT", "LFT", "Lipid Profile", "Uric Acid", "Urine Analysis", "FBS", "HbA1c", "TFT"]
            },
            bmi_severity: {
                id: "bmi_severity",
                type: "decision",
                name: "BMI Severity Assessment",
                description: "Assess BMI severity and comorbidities",
                layer: "PHC",
                icon: "🏥"
            },
            phc_management: {
                id: "phc_management",
                type: "treatment",
                name: "Follow and Manage in PHC",
                description: "Conservative management with Health Coach, Nutrition, Mental Health support",
                layer: "PHC",
                icon: "🏥"
            },
            phc_evaluation: {
                id: "phc_evaluation",
                type: "evaluation",
                name: "Evaluate After 3 Months",
                description: "Target: 5% weight loss",
                layer: "PHC",
                icon: "🏥"
            },
            phc_goal_check: {
                id: "phc_goal_check",
                type: "decision",
                name: "PHC Goal Assessment",
                description: "Check if 5% weight loss goal achieved",
                layer: "PHC",
                icon: "🏥"
            },
            continue_phc: {
                id: "continue_phc",
                type: "endpoint",
                name: "Continue Follow-up in PHC",
                description: "Goal achieved - continue regular monitoring",
                layer: "PHC",
                icon: "🏥",
                outcome: "success"
            },
            obesity_clinic: {
                id: "obesity_clinic",
                type: "referral",
                name: "Obesity Clinic (Mega Center)",
                description: "Referral to specialized Obesity Clinic",
                layer: "Mega Center",
                icon: "🏢",
                specialty: "obesity"
            },
            mega_evaluation: {
                id: "mega_evaluation",
                type: "evaluation",
                name: "Evaluate After 6 Months",
                description: "Target: 5% weight loss at Mega Center",
                layer: "Mega Center",
                icon: "🏢"
            },
            mega_goal_check: {
                id: "mega_goal_check",
                type: "decision",
                name: "Mega Center Goal Assessment",
                description: "Check if 5% weight loss goal achieved",
                layer: "Mega Center",
                icon: "🏢"
            },
            continue_mega: {
                id: "continue_mega",
                type: "treatment",
                name: "Continue Follow-up (1 Year)",
                description: "Continue with Health Coach, Nutrition, Mental Health for 1 year, then discharge",
                layer: "Mega Center",
                icon: "🏢",
                outcome: "success"
            },
            dmc_referral: {
                id: "dmc_referral",
                type: "referral",
                name: "DMC (Hospital)",
                description: "Referral for Bariatric Surgery evaluation",
                layer: "Hospital",
                icon: "🏨",
                specialty: "bariatric_surgery"
            },
            post_surgery: {
                id: "post_surgery",
                type: "endpoint",
                name: "Post Bariatric Surgery Follow-up",
                description: "Long-term surgical management",
                layer: "Hospital",
                icon: "🏨"
            }
        };

        // Helper functions
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const bmi = weight / Math.pow(height / 100, 2);
            document.getElementById('bmi-value').textContent = bmi.toFixed(1);

            let category = "";
            if (bmi < 18.5) category = "Underweight";
            else if (bmi < 25) category = "Normal weight";
            else if (bmi < 30) category = "Overweight";
            else if (bmi < 35) category = "Class I Obesity";
            else if (bmi < 40) category = "Class II Obesity";
            else category = "Class III Obesity (Morbid)";

            document.getElementById('bmi-category').textContent = category;
            updatePathway();
        }

        function updateWeightLoss() {
            const value = document.getElementById('weight-loss').value;
            document.getElementById('weight-loss-value').textContent = value;
            updatePathway();
        }

        function getPatientData() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            return {
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                bmi: weight / Math.pow(height / 100, 2),
                hasSecondaryCause: document.getElementById('secondary-cause').checked,
                hasComorbidities: document.getElementById('comorbidities').checked,
                weightLossPercent: parseInt(document.getElementById('weight-loss').value)
            };
        }

        function determinePathway(patient) {
            const path = [];

            // Check age eligibility
            if (patient.age < 15) {
                return [{ ...pathwayNodes.screening, note: "Age < 15: Use Pediatric Pathway" }];
            }

            // Step 1: Screening
            path.push(pathwayNodes.screening);

            // Step 2: BMI Check
            path.push(pathwayNodes.bmi_check);

            if (patient.bmi < 25) {
                // Normal weight
                path.push(pathwayNodes.exit_healthy);
                return path;
            }

            if (patient.hasSecondaryCause) {
                // Refer to specialty
                path.push(pathwayNodes.refer_specialty);
                return path;
            }

            // BMI >= 25 without secondary cause
            path.push(pathwayNodes.diagnostic_tests);
            path.push(pathwayNodes.bmi_severity);

            if (patient.bmi >= 40 || (patient.bmi >= 35 && patient.hasComorbidities)) {
                // Direct to obesity clinic
                path.push(pathwayNodes.obesity_clinic);
                path.push(pathwayNodes.mega_evaluation);
                path.push(pathwayNodes.mega_goal_check);

                if (patient.weightLossPercent >= 5) {
                    path.push(pathwayNodes.continue_mega);
                } else {
                    path.push(pathwayNodes.dmc_referral);
                    path.push(pathwayNodes.post_surgery);
                }
            } else {
                // PHC management first
                path.push(pathwayNodes.phc_management);
                path.push(pathwayNodes.phc_evaluation);
                path.push(pathwayNodes.phc_goal_check);

                if (patient.weightLossPercent >= 5) {
                    path.push(pathwayNodes.continue_phc);
                } else {
                    path.push(pathwayNodes.obesity_clinic);
                    path.push(pathwayNodes.mega_evaluation);
                    path.push(pathwayNodes.mega_goal_check);

                    if (patient.weightLossPercent >= 5) {
                        path.push(pathwayNodes.continue_mega);
                    } else {
                        path.push(pathwayNodes.dmc_referral);
                        path.push(pathwayNodes.post_surgery);
                    }
                }
            }

            return path;
        }

        function findClinics(specialty) {
            const clinics = [];
            const centers = clusters.eastern.networks.dammam.centers;

            for (const center of centers) {
                for (const clinic of center.clinics) {
                    if (clinic.specialty === specialty) {
                        clinics.push({
                            clinic: clinic.name,
                            center: center.name,
                            status: clinic.status
                        });
                    }
                }
            }
            return clinics;
        }

        function renderPathway(path) {
            const container = document.getElementById('pathway-container');
            container.innerHTML = '';

            path.forEach((node, index) => {
                const isLast = index === path.length - 1;

                const nodeEl = document.createElement('div');
                nodeEl.className = `pathway-node node-${node.type} ${isLast ? 'active' : ''}`;

                let detailsHTML = '';

                // Add tests for diagnostic node
                if (node.tests) {
                    detailsHTML += `<div class="node-details"><strong>Required Tests:</strong><div class="test-list">`;
                    node.tests.forEach(test => {
                        detailsHTML += `<span class="test-badge">${test}</span>`;
                    });
                    detailsHTML += `</div></div>`;
                }

                // Add clinic options for referral nodes
                if (node.specialty) {
                    const clinics = findClinics(node.specialty);
                    if (clinics.length > 0) {
                        detailsHTML += `<div class="node-details"><strong>Available Clinics:</strong><div class="clinic-list">`;
                        clinics.forEach(c => {
                            detailsHTML += `<div class="clinic-item">
                                <span class="status-dot status-${c.status}"></span>
                                <span>${c.clinic} - ${c.center}</span>
                            </div>`;
                        });
                        detailsHTML += `</div></div>`;
                    }
                }

                // Add outcome badge
                if (node.outcome) {
                    detailsHTML += `<div class="node-details" style="color: ${node.outcome === 'success' ? '#2e7d32' : '#c62828'}">
                        <strong>Outcome:</strong> ${node.outcome === 'success' ? '✓ Successful management' : 'Requires escalation'}
                    </div>`;
                }

                nodeEl.innerHTML = `
                    <div class="node-title">
                        <span>${node.icon} ${node.name}</span>
                        <span class="node-layer">${node.layer}</span>
                    </div>
                    <div class="node-description">${node.description}</div>
                    ${detailsHTML}
                `;

                container.appendChild(nodeEl);

                if (!isLast) {
                    const arrow = document.createElement('div');
                    arrow.className = 'arrow';
                    arrow.textContent = '↓';
                    container.appendChild(arrow);
                }
            });
        }

        function updatePathway() {
            const patient = getPatientData();
            const path = determinePathway(patient);
            renderPathway(path);
        }

        function renderHierarchy() {
            const centers = clusters.eastern.networks.dammam.centers;

            const phcContainer = document.getElementById('phc-centers');
            const megaContainer = document.getElementById('mega-centers');
            const hospitalContainer = document.getElementById('hospital-centers');

            phcContainer.innerHTML = '';
            megaContainer.innerHTML = '';
            hospitalContainer.innerHTML = '';

            centers.forEach(center => {
                const card = document.createElement('div');
                card.className = 'center-card';

                let clinicsHTML = '';
                center.clinics.forEach(clinic => {
                    clinicsHTML += `<span class="clinic-badge">${clinic.name}</span>`;
                });

                card.innerHTML = `
                    <div class="center-name">${center.name}</div>
                    <div class="center-name-ar">${center.name_ar}</div>
                    <div style="margin-top: 8px">${clinicsHTML}</div>
                `;

                if (center.type === 'phc') {
                    phcContainer.appendChild(card);
                } else if (center.type === 'mega') {
                    megaContainer.appendChild(card);
                } else {
                    hospitalContainer.appendChild(card);
                }
            });
        }

        function showTab(tabName) {
            // Update tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
        }

        // Event listeners for conditional fields
        document.getElementById('secondary-cause').addEventListener('change', function() {
            document.getElementById('secondary-cause-select').style.display = this.checked ? 'block' : 'none';
        });

        document.getElementById('comorbidities').addEventListener('change', function() {
            document.getElementById('comorbidities-select').style.display = this.checked ? 'block' : 'none';
        });

        // Initialize
        calculateBMI();
        renderHierarchy();
    </script>
</body>
</html>
